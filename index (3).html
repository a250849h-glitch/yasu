<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ことのは ・ Word Nest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Inter','Noto Sans JP',sans-serif; background: #EDE6D4; }
button { font-family: inherit; }
input, textarea { font-family: inherit; }
.spin { animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

.app-bg { width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 0; }
.phone { width: 100%; max-width: 420px; height: 780px; background: #F7F2E7; border-radius: 32px; box-shadow: 0 25px 60px -15px rgba(43,58,74,0.35); border: 1px solid #E3D9C2; display: flex; flex-direction: column; overflow: hidden; }

.row { display: flex; }
.col { display: flex; flex-direction: column; }
.flex1 { flex: 1 1 0%; }
.min0 { min-height: 0; }
.gap2 { gap: 8px; }
.gap3 { gap: 12px; }
.aend { align-items: flex-end; }
.aistart { align-items: flex-start; }
.jend { justify-content: flex-end; }
.jstart { justify-content: flex-start; }
.jbetween { justify-content: space-between; }
.row.gap2, .row.gap3 { align-items: center; }
.row.jend, .row.jstart { align-items: stretch; }

.hdr { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 12px; border-bottom: 1px solid #E3D9C2; }
.logo { width: 34px; height: 34px; border-radius: 9999px; background: #74936B; display: flex; align-items: center; justify-content: center; }
.badge { display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 9999px; background: #E4ECE0; color: #74936B; font-size: 12px; font-weight: 600; }
.gear { width: 30px; height: 30px; border-radius: 9999px; background: #FFFDF8; border: 1px solid #E3D9C2; display: flex; align-items: center; justify-content: center; cursor: pointer; }

.chatscroll { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background-image: repeating-linear-gradient(#F7F2E7 0px, #F7F2E7 27px, #EAE1CC 28px); }
.bubble { padding: 10px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.5; white-space: pre-line; }
.bubble.loading { display: flex; align-items: center; gap: 8px; background: #FFFDF8; border: 1px solid #E3D9C2; }
.word-hl { border-radius: 4px; padding: 0 2px; transition: background-color 0.15s; }
.word-hl:hover { background-color: rgba(253,230,138,0.7); }
.link { margin-top: 4px; padding: 0 4px; font-size: 11px; font-weight: 600; background: none; border: none; cursor: pointer; }
.transbox { margin-top: 4px; padding: 8px 12px; border-radius: 12px; background: #E4ECE0; color: #2B3A4A; font-size: 12.5px; }

.composer { padding: 8px 12px 12px; border-top: 1px solid #E3D9C2; background: #F7F2E7; }
.inp { flex: 1; padding: 10px 14px; border-radius: 9999px; outline: none; background: #FFFDF8; border: 1px solid #E3D9C2; font-size: 14px; color: #2B3A4A; }
.sendbtn { width: 40px; height: 40px; border-radius: 9999px; color: #fff; flex-shrink: 0; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.hint { font-size: 10.5px; color: #637184; margin-top: 6px; text-align: center; }

.transtab { padding: 16px; gap: 12px; overflow-y: auto; }
.dirbtn { flex: 1; padding: 8px 0; border-radius: 9999px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.ta { width: 100%; padding: 12px 14px; border-radius: 16px; outline: none; resize: none; background: #FFFDF8; border: 1px solid #E3D9C2; font-size: 14.5px; color: #2B3A4A; }
.resultbox { flex: 1; padding: 12px 14px; border-radius: 16px; position: relative; background: #E4ECE0; border: 1px solid #E3D9C2; min-height: 120px; }
.addchip { margin-top: 12px; padding: 6px 12px; border-radius: 9999px; display: inline-flex; align-items: center; gap: 4px; background: #E1654A; color: #fff; font-size: 12px; font-weight: 600; border: none; cursor: pointer; }

.vocabhead { padding: 16px 16px 8px; display: flex; gap: 8px; }
.addbtn { padding: 0 16px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 600; border: none; cursor: pointer; }
.vocabscroll { flex: 1; overflow-y: auto; padding: 8px 16px; display: flex; flex-direction: column; gap: 12px; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; margin-top: 60px; color: #637184; }
.cardflip { position: relative; min-height: 78px; transform-style: preserve-3d; transition: transform 0.45s ease; }
.cardface { position: absolute; inset: 0; backface-visibility: hidden; padding: 12px 16px; border-radius: 16px; }
.cardfront { background: #FFFDF8; border: 1px solid #E3D9C2; display: flex; align-items: center; justify-content: space-between; }
.cardback { transform: rotateY(180deg); background: #2B3A4A; color: #fff; display: flex; flex-direction: column; justify-content: center; }

.nav { display: flex; border-top: 1px solid #E3D9C2; background: #FFFDF8; }
.tabbtn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 0; background: none; border: none; cursor: pointer; transition: color 0.15s; }

.sheet-overlay { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; z-index: 50; background: rgba(43,58,74,0.4); }
.sheet { width: 100%; max-width: 420px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; background: #F7F2E7; border-radius: 24px 24px 0 0; border: 1px solid #E3D9C2; }
.grip { width: 36px; height: 4px; background: #E3D9C2; border-radius: 4px; }

.modal-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 50; padding: 0 24px; background: rgba(43,58,74,0.45); }
.modal { width: 100%; max-width: 380px; padding: 24px 20px; display: flex; flex-direction: column; gap: 12px; border-radius: 24px; background: #F7F2E7; border: 1px solid #E3D9C2; }
.keyinp { width: 100%; padding: 10px 14px; border-radius: 9999px; outline: none; background: #FFFDF8; border: 1px solid #E3D9C2; font-size: 13.5px; color: #2B3A4A; font-family: 'JetBrains Mono',monospace; }

.ghostbtn { flex: 1; padding: 10px 0; border-radius: 9999px; background: #FFFDF8; border: 1px solid #E3D9C2; color: #637184; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.primarybtn { flex: 1; padding: 10px 0; border-radius: 9999px; background: #E1654A; color: #fff; font-size: 13.5px; font-weight: 600; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }

.toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); padding: 8px 16px; border-radius: 9999px; z-index: 50; background: #2B3A4A; color: #fff; font-size: 13px; }

</style>
</head>
<body>
<div id="root"></div>
